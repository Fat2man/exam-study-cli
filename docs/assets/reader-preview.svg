<svg xmlns="http://www.w3.org/2000/svg" width="1072" height="374" viewBox="0 0 1072 374" role="img" aria-labelledby="title desc">
  <title id="title">Exam Study CLI — 数学阅读演示</title>
  <desc id="desc">使用原创教材运行终端阅读器的输出实录。界面显示 LaTeX 原文、块编号、阅读位置、未映射状态和快捷键。</desc>
  <defs>
