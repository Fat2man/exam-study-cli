    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1070" height="372" rx="22" fill="url(#background)" stroke="#324359" stroke-width="2"/>
  <path d="M2 56h1068M28 262h1016" stroke="#2a384d"/>
  <circle cx="27" cy="29" r="5" fill="#fa7b88"/>
  <circle cx="46" cy="29" r="5" fill="#f6c46a"/>
  <circle cx="65" cy="29" r="5" fill="#5bd6ae"/>
